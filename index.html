<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Hello World | Antigravity Design</title>
  <!-- Google Fonts: Outfit cho phong cách hiện đại, thanh lịch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- styles/main.css: Quản lý toàn bộ giao diện của trang -->
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <div class="blob-container">
    <div class="blob"></div>
    <div class="blob"></div>
  </div>

  <!-- Container chính: Sử dụng hiệu ứng Glassmorphism -->
  <main class="glass-card">
    <div class="content-wrapper">
      <!-- Tiêu đề thay đổi động dựa trên JavaScript -->
      <h1 id="title" class="title">Hello World</h1>
      <!-- Mô tả dự án: Ngắn gọn và súc tích -->
      <p class="subtitle">Khám phá sức mạnh của quy trình Git chuẩn kết hợp với thiết kế hiện đại.</p>

      <!-- Nút tương tác: Có hiệu ứng hover và feedback mượt mà -->
      <button id="toggleButton" class="btn-primary" type="button">
        <span>Đổi ngôn ngữ</span>
        <div class="btn-glow"></div>
      </button>
    </div>
  </main>

  <!-- scripts/app.js: Xử lý logic thay đổi nội dung trang -->
  <script src="scripts/app.js"></script>
</body>

</html>
